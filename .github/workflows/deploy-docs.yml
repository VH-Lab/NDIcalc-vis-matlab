name: Generate Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # Pinned rather than ubuntu-latest so that the operating system reported in
    # the paper's Code Accessibility statement stays true as ubuntu-latest moves.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start virtual display server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs and mkdocs-material
        run: pip install mkdocs mkdocs-material

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: 'latest'
          cache: true
          products: |
            Communications_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox
            Curve_Fitting_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Build Documentation (MATLAB)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            mkdir('tools');
            copyfile('requirements.txt', fullfile('tools', 'requirements.txt'));
            matbox.installRequirements(fullfile(pwd, 'tools'));

            % Prevent doc crawler from descending into MATLAB-AddOns
            fclose(fopen(fullfile('MATLAB-AddOns', '.matlab2markdown-ignore'), 'w'));

            addpath(genpath(fullfile(pwd, 'tools')));
            addpath(genpath('MATLAB-AddOns'));
            addpath(genpath(pwd));

            % Let NDI-matlab's find_calc_directories() discover this package
            % regardless of the folder name the checkout landed in.
            ndi.fun.linkCalcDirectory();

            % Build NDI-matlab docs first so documentation_structure.mat
            % exists for cross-linking in calcbuild
            ndi.docs.build();

            ndi.docs.calcbuild(pwd);

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
