name: Python packaging

# Builds the ndicalc-vis-matlab wheel and sdist (the pip/uv packaging NDI-python
# depends on), installs the wheel into a fresh environment on each OS, and
# checks that it carries all of ndi_common. The MATLAB toolbox is not involved.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'ndi_common/**'
      - '.github/workflows/python-packaging.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'python/**'
      - 'pyproject.toml'
      - 'ndi_common/**'
      - '.github/workflows/python-packaging.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/venv/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/venv/bin/python"
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl pytest
      - name: Run tests against the installed wheel
        shell: bash
        env:
          NDICALC_EXPECT_WHEEL: '1'
        run: |
          "$PY" -m pytest -v -rs -p no:cacheprovider python/tests
