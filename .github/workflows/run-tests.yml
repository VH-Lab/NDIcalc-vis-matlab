name: Run Test Suite

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - '.github/workflows/**'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      matlab_release:
        description: 'MATLAB Release'
        required: false
        default: 'latest'
        type: choice
        options:
          - 'latest'
          - 'R2025a'
          - 'R2024b'
          - 'R2024a'
          - 'R2023b'
          - 'R2023a'
          - 'R2022b'
          - 'R2022a'
          - 'R2021b'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_tests:
    name: Run tests (MATLAB ${{ inputs.matlab_release || 'latest' }})
    # Pinned rather than ubuntu-latest so that the operating system reported in
    # the paper's Code Accessibility statement stays true as ubuntu-latest moves.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Start virtual display server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab_release || 'latest' }}
          cache: true
          # Parallel_Computing_Toolbox is required: without it parfor degrades
          # to a serial loop and the parallel paths in
          # vis.revcorr.calculateHartleyResponse and vis.revcorr.generate_STA
          # are never exercised here, which is where a reviewer reported the
          # Hartley self-test hanging (R1.40).
          products: |
            Communications_Toolbox
            Optimization_Toolbox
            Statistics_and_Machine_Learning_Toolbox
            Signal_Processing_Toolbox
            Curve_Fitting_Toolbox
            Parallel_Computing_Toolbox

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        uses: matlab-actions/run-command@v2
        # matbox.installRequirements fetches NDI-matlab through the GitHub API.
        # Unauthenticated, that is 60 requests an hour shared by IP across
        # GitHub-hosted runners, so it fails whenever someone else has spent
        # the budget -- "GitHub API rate limit exceeded", raised before a
        # single test runs. The automatic token raises it to 1000 an hour for
        # this repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: |
            mkdir('tools');
            copyfile('requirements.txt', fullfile('tools', 'requirements.txt'));
            matbox.installRequirements(fullfile(pwd, 'tools'));

            addpath(genpath(fullfile(pwd, 'tools')));
            addpath(genpath('MATLAB-AddOns'));
            addpath(genpath(pwd));

            % NDI-matlab's find_calc_directories() looks beside NDI-matlab for
            % folders named NDIcalc*-matlab; the CI checkout is not one, so
            % link it. See ndi.fun.checkCalcDirectory for the diagnostic the
            % self-tests raise when this step is missing.
            ndiParent = fileparts(fileparts(fileparts(ndi.toolboxdir)));
            linkPath = fullfile(ndiParent, 'NDIcalc-vis-matlab');
            if ~isfolder(linkPath)
                system(sprintf('ln -s "%s" "%s"', pwd, linkPath));
            end

            % The NewStim globals hartleystim needs are set by testHartley's
            % own TestClassSetup, so that the test behaves the same here as it
            % does for someone running it from MATLAB. Nothing needed here.

            testsDir = fullfile(pwd, 'tests');
            addpath(testsDir);

            import matlab.unittest.TestSuite
            import matlab.unittest.TestRunner

            suite = TestSuite.fromFolder(testsDir, 'IncludingSubfolders', true);

            fprintf('\n=== Discovered %d test(s) ===\n', numel(suite));
            for k = 1:numel(suite)
                fprintf('  %s\n', suite(k).Name);
            end

            runner = TestRunner.withTextOutput;
            results = runner.run(suite);

            disp(table(results));
            assert(all(~[results.Failed]), 'Some tests failed');
